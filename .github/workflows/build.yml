name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: MRO-Face-macOS-arm64
          - os: windows-latest
            artifact: MRO-Face-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/fetch_models.py
      - run: pyinstaller packaging/mro_face.spec --noconfirm --clean
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MRO Face.app" "dist/${{ matrix.artifact }}.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/MRO Face" -DestinationPath "dist/${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
